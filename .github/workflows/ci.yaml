name: Pull Request CI

on:
  pull_request:
    branches:
      - devel
      - stage
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# The workflow only needs permission to read repository contents.
permissions:
  contents: read

# Cancel the previous workflow run when another commit
# is pushed to the same pull request.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-branch-flow:
    name: Validate PR branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        if: github.base_ref == 'stage' && github.head_ref != 'devel'
        run: |
          echo "ERROR: Only the devel branch can be merged into stage."
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          exit 1

      - name: Branch validation passed
        run: |
          echo "Valid branch flow: ${{ github.head_ref }} -> ${{ github.base_ref }}"

  application-ci:
    name: Install, lint, test and build
    needs: validate-branch-flow
    runs-on: ubuntu-latest

    # Run all npm commands from the actual application directory.
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "15.5.1"
          package-manager-cache: false

      - name: Display runtime versions and available scripts
        run: |
          node --version
          npm --version
          pwd
          npm run

      - name: Install dependencies
        env:
          # Allows this older React dependency tree to install with npm 7.
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        env:
          CI: "true"
        run: npm run test

      - name: Build production application
        run: npm run build