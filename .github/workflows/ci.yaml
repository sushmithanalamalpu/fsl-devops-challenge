name: Pull Request CI

on:
  pull_request:
    branches:
      - devel
      - stage
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-branch-flow:
    name: Validate PR branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        shell: bash
        run: |
          if [[ "${{ github.base_ref }}" == "stage" && "${{ github.head_ref }}" != "devel" ]]; then
            echo "ERROR: Only the devel branch can be merged into stage."
            echo "Source branch: ${{ github.head_ref }}"
            echo "Target branch: ${{ github.base_ref }}"
            exit 1
          fi

          echo "Valid branch flow: ${{ github.head_ref }} -> ${{ github.base_ref }}"

  application-ci:
    name: Install, lint, test and build
    needs: validate-branch-flow
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0

    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Display runtime versions
        run: |
          node --version
          npm --version
          pwd
          npm run

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        env:
          CI: "true"
        run: npm run test

      - name: Build production application
        run: npm run build