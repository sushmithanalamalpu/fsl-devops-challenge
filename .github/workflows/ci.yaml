name: Pull Request CI
on:
  push:
    branches:
      - feature/devel
  pull_request:
    branches:
      - devel
      - stage
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-branch-flow:
    name: Validate PR branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "stage" && "$SOURCE_BRANCH" != "devel" ]]; then
            echo "ERROR: Only the devel branch can be merged into stage."
            echo "Source branch: $SOURCE_BRANCH"
            echo "Target branch: $BASE_BRANCH"
            exit 1
          fi

          echo "Valid branch flow: $SOURCE_BRANCH -> $BASE_BRANCH"

  application-ci:
    name: Install, lint, test and build
    needs: validate-branch-flow
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify dependency lock file
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "ERROR: package-lock.json is missing from codebase/rdicidr-0.1.0."
            echo "Commit the lock file so CI installs the tested dependency versions."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
          cache: npm
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json


      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        env:
          CI: "true"
        run: npm run test

      - name: Build production application
        run: npm run build
